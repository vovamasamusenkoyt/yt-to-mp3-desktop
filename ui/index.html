<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>YouTube to MP3 Converter</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Segoe+UI:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="bg-effects">
    <div class="glow-sphere glow-sphere-1"></div>
    <div class="glow-sphere glow-sphere-2"></div>
  </div>

  <div class="app-layout">
    <!-- Header -->
    <header class="app-header">
      <div class="logo-box">
        <div class="logo-badge">
          <svg viewBox="0 0 24 24" width="24" height="24" fill="currentColor">
            <path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm-2 14.5v-9l6 4.5-6 4.5z"/>
          </svg>
        </div>
        <div class="logo-titles">
          <h2>YouTube <span class="accent">to MP3</span></h2>
          <span class="desktop-badge">Standalone Desktop (Rust + Tauri)</span>
        </div>
      </div>
    </header>

    <!-- Save Directory Selector -->
    <section class="folder-bar">
      <div class="folder-info">
        <svg class="folder-icon" viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2">
          <path stroke-linecap="round" stroke-linejoin="round" d="M3 7v10a2 2 0 002 2h14a2 2 0 002-2V9a2 2 0 00-2-2h-6l-2-2H5a2 2 0 00-2 2z" />
        </svg>
        <span class="folder-label">Папка сохранения:</span>
        <span id="output-path" class="folder-path" title="Путь для сохранения MP3">Определение папки...</span>
      </div>
      <button type="button" id="browse-folder-btn" class="btn btn-outline-sm">
        Обзор...
      </button>
    </section>

    <!-- Main Content Area -->
    <main class="main-card">
      <!-- Input Section -->
      <form id="url-form" class="url-form" onsubmit="event.preventDefault(); fetchInfo();">
        <div class="input-wrapper">
          <svg class="input-icon" viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2">
            <path stroke-linecap="round" stroke-linejoin="round" d="M13.828 10.172a4 4 0 00-5.656 0l-4 4a4 4 0 105.656 5.656l1.102-1.101m-.758-4.899a4 4 0 005.656 0l4-4a4 4 0 00-5.656-5.656l-1.1 1.1" />
          </svg>
          <input 
            type="text" 
            id="video-url" 
            placeholder="Вставьте ссылку на YouTube (https://youtu.be/...)"
            autocomplete="off"
            spellcheck="false"
            required
          >
          <div class="input-actions">
            <button type="button" id="paste-btn" class="btn-icon" title="Вставить из буфера">
              <svg viewBox="0 0 24 24" width="17" height="17" fill="none" stroke="currentColor" stroke-width="2">
                <path stroke-linecap="round" stroke-linejoin="round" d="M9 5H7a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2V7a2 2 0 00-2-2h-2M9 5a2 2 0 002 2h2a2 2 0 002-2M9 5a2 2 0 012-2h2a2 2 0 012 2" />
              </svg>
            </button>
            <button type="button" id="clear-btn" class="btn-icon hidden" title="Очистить">
              <svg viewBox="0 0 24 24" width="17" height="17" fill="none" stroke="currentColor" stroke-width="2">
                <path stroke-linecap="round" stroke-linejoin="round" d="M6 18L18 6M6 6l12 12" />
              </svg>
            </button>
          </div>
        </div>
        <button type="submit" id="search-btn" class="btn btn-primary">
          <span class="btn-text">Найти</span>
          <div class="spinner hidden" id="search-spinner"></div>
        </button>
      </form>

      <!-- Error Banner -->
      <div id="error-box" class="error-box hidden">
        <svg viewBox="0 0 24 24" width="20" height="20" fill="currentColor">
          <path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm1 15h-2v-2h2v2zm0-4h-2V7h2v6z"/>
        </svg>
        <span id="error-message"></span>
        <button type="button" class="close-error" onclick="hideError()">✕</button>
      </div>

      <!-- Video Preview Card -->
      <section id="preview-section" class="preview-section hidden">
        <div class="video-preview-card">
          <div class="thumbnail-wrapper">
            <img id="video-thumb" src="" alt="Обложка видео">
            <span id="video-duration" class="badge-duration">00:00</span>
          </div>
          <div class="video-meta">
            <h3 id="video-title" class="video-title">Заголовок видео</h3>
            <div class="author-row">
              <span id="video-author">Автор</span>
              <span class="dot">•</span>
              <span id="video-views">0 просмотров</span>
            </div>

            <!-- Quality Selector -->
            <div class="bitrate-control">
              <span class="bitrate-label">Качество MP3:</span>
              <div class="bitrate-options">
                <label class="bitrate-pill">
                  <input type="radio" name="quality" value="128">
                  <span>128 kbps <small>(быстро)</small></span>
                </label>
                <label class="bitrate-pill">
                  <input type="radio" name="quality" value="192" checked>
                  <span>192 kbps <small>(баланс)</small></span>
                </label>
                <label class="bitrate-pill">
                  <input type="radio" name="quality" value="320">
                  <span>320 kbps <small>(HQ)</small></span>
                </label>
              </div>
            </div>

            <button id="convert-btn" class="btn btn-convert" onclick="startDownload()">
              <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2">
                <path stroke-linecap="round" stroke-linejoin="round" d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-4l-4 4m0 0l-4-4m4 4V4" />
              </svg>
              <span>Конвертировать и сохранить в MP3</span>
            </button>
          </div>
        </div>
      </section>

      <!-- Progress Section -->
      <section id="progress-section" class="progress-section hidden">
        <div class="progress-meta">
          <div class="stage-wrapper">
            <span class="pulse-indicator"></span>
            <span id="stage-text">Подключение к YouTube...</span>
          </div>
          <span id="progress-percent" class="percent-label">0%</span>
        </div>

        <div class="progress-track">
          <div id="progress-fill" class="progress-fill" style="width: 0%"></div>
        </div>

        <div class="progress-info-row">
          <span id="stat-size"></span>
          <span id="stat-speed"></span>
          <span id="stat-eta"></span>
        </div>
      </section>

      <!-- Completed Section -->
      <section id="complete-section" class="complete-section hidden">
        <div class="success-banner">
          <div class="success-check">
            <svg viewBox="0 0 24 24" width="28" height="28" fill="none" stroke="currentColor" stroke-width="2.5">
              <path stroke-linecap="round" stroke-linejoin="round" d="M5 13l4 4L19 7" />
            </svg>
          </div>
          <div class="success-details">
            <h4>Файл успешно сохранён на диск!</h4>
            <p id="saved-filepath" class="saved-path"></p>
          </div>
        </div>

        <div class="action-buttons">
          <button id="open-folder-btn" class="btn btn-folder" onclick="openFileInFolder()">
            <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2">
              <path stroke-linecap="round" stroke-linejoin="round" d="M3 7v10a2 2 0 002 2h14a2 2 0 002-2V9a2 2 0 00-2-2h-6l-2-2H5a2 2 0 00-2 2z" />
            </svg>
            <span>Показать в Проводнике</span>
          </button>
          <button type="button" class="btn btn-secondary" onclick="resetUI()">
            <span>Конвертировать ещё видео</span>
          </button>
        </div>
      </section>
    </main>

    <footer class="app-footer">
      <span>Standalone Monolithic .EXE • Вшитые yt-dlp & FFmpeg • Rust & Tauri</span>
    </footer>
  </div>

  <script src="app.js"></script>
</body>
</html>

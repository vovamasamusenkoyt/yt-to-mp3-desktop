[package]
name = "yt-to-mp3-desktop"
version = "1.0.0"
description = "YouTube to MP3 Desktop Converter on Rust + Tauri"
authors = ["Antigravity"]
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1", features = ["full"] }
rfd = "0.15"
dirs = "5.0"
regex = "1.11"
open = "5.3"
